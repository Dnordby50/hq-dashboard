[build]
  functions = "netlify/functions"
  publish = "."
  # The dashboard (index.html) is static and needs no build. This command exists
  # only to build the estimator PWA into repo-root /estimator (Vite base
  # '/estimator/'), which `publish = "."` then serves as static files. The root
  # app is untouched.
  # The migration manifest is regenerated first so the deployed
  # pec-migration-drift function always probes against the migrations in THIS
  # deploy's commit (functions have no repo tree at runtime).
  command = "node scripts/build-migration-manifest.mjs && npm --prefix apps/estimator ci && npm --prefix apps/estimator run build"

[build.environment]
  # Pin Node so the estimator build is reproducible on Netlify (Vite 5 needs 18+).
  NODE_VERSION = "20"
  # Build-time key for the estimator PWA's Google Places address autocomplete
  # (apps/estimator/src/lib/places.ts reads import.meta.env.VITE_GOOGLE_MAPS_KEY).
  # Same referrer- and API-restricted browser key the dashboard uses; Vite inlines
  # it at build time, so the estimator needs a REDEPLOY after any key change.
  VITE_GOOGLE_MAPS_KEY = "AIzaSyBUqdRk4eIiEoc0vXK7XZz-4TiGdxnoGlY"
  # Tell Netlify's secret scanner that this Google API key value is intentional.
  # The key is used client-side for BOTH the Google Sheets proxy and Google Maps
  # (index.html around lines 2612 and 19368). It is safe to ship in the client
  # bundle ONLY while it stays restricted in Google Cloud Console to (a) exactly the
  # APIs it needs (Sheets + Maps JavaScript/Static as applicable) and (b) the HTTP
  # referrer prescottepoxy.netlify.app/* (plus any custom domain).
  # NOTE: after any domain rename, update the referrer restriction in Google Cloud
  # Console or Maps/Sheets calls from the new domain will be rejected (Dylan handoff).
  # If the key is rotated, update every occurrence in index.html AND this value.
  # Second value: the OLD transposed (I/l swapped) key string that the 1d8d514
  # fix retired. It is INVALID at Google (that key never existed) but the
  # string survives in append-only PROJECT-LOG entries and the prompt-37 doc,
  # and once the omit value was corrected the scanner started failing every
  # deploy on it ("AIza*** detected as a likely secret" in
  # claude-code-prompt-37-appointments-calendar.md). Omitting a nonexistent
  # key is safe; do not remove either value.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBUqdRk4eIiEoc0vXK7XZz-4TiGdxnoGlY,AIzaSyBUqdRk4eliEoc0vXK7XZz-4TiGdxnoGIY"

[functions]
  node_bundler = "esbuild"

# Daily auto-status sweep: flips public.jobs.status from 'scheduled' to
# 'in_progress' for jobs whose pec_prod_jobs.install_date is today.
# 13:00 UTC = 06:00 MST (project is single-timezone, no DST).
[functions."pec-auto-progress"]
  schedule = "0 13 * * *"

# OpenPhone (now Quo) call/transcript pull onto leads (as 'call' lead_events).
# Uses the QUO_API_KEY already in the env (same key pec-send-sms uses against the
# same api.openphone.com base); no separate OPENPHONE_API_KEY is required.
# Every 15 minutes; the call-id dedupe makes overlapping runs harmless.
[functions."pec-openphone-sync"]
  schedule = "*/15 * * * *"

# Lead drip engine tick (prompt 34). Every 15 minutes; the engine's master
# switch (settings key drip_sending_enabled, seeded 'false') makes a tick a
# no-op until Dylan turns sending on from the Drips admin view, and the
# claim-first advance makes overlapping runs double-send-proof.
[functions."pec-drip-runner"]
  schedule = "*/15 * * * *"

# Appointment confirmation/reminder tick (prompt 37). Every 15 minutes; the
# reminder-sends ledger's unique index makes overlapping runs exactly-once,
# quiet-hours-held SMS legs release on the next in-window tick, and before
# the appointments migration lands a run is a silent no-op.
[functions."pec-appt-reminder-runner"]
  schedule = "*/15 * * * *"

# Migration drift check (prompt 48). Daily at 14:00 UTC = 07:00 MST, after
# the 06:00 auto-progress sweep. Probes every 2026-07+ migration's @artifacts
# against the live schema and raises de-duped admin bells on missing/partial
# migrations. Also callable on demand (the Settings > Diagnostics panel and
# curl use ?manual=1&notify=0).
[functions."pec-migration-drift"]
  schedule = "0 14 * * *"

# Birthday reminder tick (prompt 54). Daily at 14:30 UTC = 07:30 MST, after
# the drift check. One bell per person per year when their birthday is within
# birthday_reminder_lead_days; the 60-day per-person dedupe makes reruns and
# missed days harmless. No-op until the people-model migration is applied,
# and gated by the birthday_reminder_enabled setting.
[functions."pec-birthday-reminders"]
  schedule = "30 14 * * *"

# Security monitor (security remediation Phase 3). Every 15 minutes: scans the
# last ~20 min of sign_in_log and Slacks an alert when a staff member signs in
# from an IP they have never used before (account-takeover signal). Gated by the
# security_alerts_enabled setting; best-effort and never throws. Lookback (20m)
# is kept >= the 15m interval so no sign-in is missed between runs.
[functions."pec-security-monitor"]
  schedule = "*/15 * * * *"

# Google -> TopCoat appointment pull (prompt 37 Phase B). Every 15 minutes;
# incremental syncToken polling per connected member (410 = drop token and
# full-resync). No-op until GOOGLE_OAUTH_* env vars are set and a member
# connects; a manual call is just an ordinary idempotent tick.
[functions."pec-google-calendar-pull"]
  schedule = "*/15 * * * *"

# Lost-reason AI backfill (prompt 62 Part G). Nightly at 15:00 UTC = 08:00
# MST: fills lost_reason / lost_notes on already-lost leads that have a
# matching call and no reason yet. Never overwrites a human value (the PATCH
# re-asserts lost_reason=is.null); every fill is tagged with a
# lost_reason_ai lead_events row. Gated by lost_reason_ai_backfill_enabled.
[functions."pec-lost-reason-backfill"]
  schedule = "0 15 * * *"

# SalesAsk sync: push upcoming appointments to SalesAsk as scheduled tasks
# (event_id = our appointment id, so the rep's recording auto-attaches),
# reconcile recent recordings (SalesAsk webhooks have NO retries, this sweep
# is the delivery guarantee), and complete pending rows (transcript fetch +
# appointment matching + the salesask_recording lead_events row). Every 15
# minutes; gated by the salesask_sync_enabled setting (seeded 'false') and
# a no-op without SALESASK_API_KEY, so the schedule is harmless before setup.
[functions."pec-salesask-sync"]
  schedule = "*/15 * * * *"

# System heartbeat (prompt 90 Task A). Daily at 14:45 UTC = 07:45 MST, after
# the morning dailies (13:00 auto-progress, 14:00 drift, 14:30 birthdays) so
# their fresh heartbeats are visible; pec-lost-reason-backfill (15:00) is
# covered by its 24h+slack window from yesterday's run. Checks scheduled-
# function staleness, webhook/send failures, the review redirect, Stripe
# pending staleness, and the public pages; stores the result for the Ops
# Queue and Slacks ONE line only when something is red. On-demand runs go
# through pec-system-heartbeat-run (Netlify 403s direct invocation of
# schedule-declared functions).
[functions."pec-system-heartbeat"]
  schedule = "45 14 * * *"

# Old auto-subdomain -> current one. The site was renamed from hq-prescott to
# prescottepoxy; this 301s any request still hitting the old netlify.app host to
# the current one (path + query preserved via :splat), so a browser Back button
# that lands on the old address forwards to the new one instead of staying there.
# Host-scoped: this only fires for the hq-prescott host, so normal traffic on
# prescottepoxy.netlify.app and the function/MCP redirects below are unaffected.
# NOTE: this only works if hq-prescott.netlify.app routes to THIS Netlify site
# (the renamed-site case). If it is a SEPARATE old site, the redirect must be set
# at that site instead (see the Handoff in PROJECT-LOG).
[[redirects]]
  from = "https://hq-prescott.netlify.app/*"
  to = "https://prescottepoxy.netlify.app/:splat"
  status = 301
  force = true

# SPA fallback for the estimator PWA (built into /estimator). Netlify serves
# existing files first, so hashed JS/CSS assets resolve normally; only unknown
# client-side routes under /estimator/ fall back to the app's index.html. The
# root dashboard at "/" is unaffected (this only matches the /estimator/ prefix).
[[redirects]]
  from = "/estimator/*"
  to = "/estimator/index.html"
  status = 200

# Clean URL for the MCP server so the Claude.ai connector and Claude Code
# .mcp.json can point at https://<site>/mcp instead of /.netlify/functions/mcp.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# OAuth 2.1 client_credentials + RFC 9728 protected-resource discovery for the
# MCP server. Anthropic's custom connector UI uses OAuth Client ID + Secret;
# the function branches on path. The /mcp/.well-known/* duplicates exist
# because some MCP clients probe relative to the protected-resource URL rather
# than the issuer root.
[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# RFC 8414 / 9728 canonical "path-insertion" form: the well-known segment is
# inserted BEFORE the resource path (/mcp). Some clients build this URL
# themselves rather than following the resource_metadata URL we advertise in
# the WWW-Authenticate header, so serve it too.
[[redirects]]
  from = "/.well-known/oauth-authorization-server/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/authorize"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/register"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# Public hosted invoice page. /pay/<token> rewrites to the function with the
# token in the query string (event.queryStringParameters.token).
[[redirects]]
  from = "/pay/*"
  to = "/.netlify/functions/pec-public-invoice?token=:splat"
  status = 200
  force = true

# Review tracking link (prompt 60). /r/<token> logs the click on the
# pec_review_requests row and 302s to the Google review page. The function
# must NEVER show the customer an error: any failure still redirects.
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/pec-review-redirect?token=:splat"
  status = 200
  force = true

# Public customer-facing estimate (same token pattern as /pay). /e/<token>
# renders the estimate for review + sign; the link is inert (404) until the
# dashboard's Send action stamps estimates.sent_at.
[[redirects]]
  from = "/e/*"
  to = "/.netlify/functions/pec-public-estimate?token=:splat"
  status = 200
  force = true

# The estimate page's three actions (accept and sign / request changes /
# reject). Same function; the HTTP method distinguishes render (GET) from
# action (POST), mirroring the change-order pattern below.
[[redirects]]
  from = "/api/estimate/action"
  to = "/.netlify/functions/pec-public-estimate"
  status = 200
  force = true

# BATCH change-order approval page (/co/batch/<token>, prompt 31) plus its
# signing POST. MUST stay ABOVE the /co/* rule: Netlify takes the first
# matching redirect, and /co/* would otherwise swallow /co/batch/<token> and
# hand "batch/<token>" to the single-CO page as its token.
[[redirects]]
  from = "/co/batch/*"
  to = "/.netlify/functions/pec-public-change-order-batch?token=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/co/batch/sign"
  to = "/.netlify/functions/pec-public-change-order-batch"
  status = 200
  force = true

# Public change-order approval page (same token pattern as /pay), plus its
# signing POST. Both land on pec-public-change-order; the HTTP method
# distinguishes render (GET) from sign (POST).
[[redirects]]
  from = "/co/*"
  to = "/.netlify/functions/pec-public-change-order?token=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/co/sign"
  to = "/.netlify/functions/pec-public-change-order"
  status = 200
  force = true

# Stripe: clean paths for the Checkout-session creator (linked from the invoice
# page) and the webhook (the only place a card payment is recorded). The webhook
# URL goes into the Stripe Dashboard endpoint config.
[[redirects]]
  from = "/api/stripe/checkout"
  to = "/.netlify/functions/pec-stripe-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/pec-stripe-webhook"
  status = 200
  force = true

# Quo (OpenPhone) inbound SMS webhook. Quo POSTs here when a customer texts one
# of our workspace numbers; the function powers two-way texting + STOP handling.
# This clean URL (with the QUO_WEBHOOK_SECRET) goes into the Quo webhook config.
[[redirects]]
  from = "/api/quo/webhook"
  to = "/.netlify/functions/pec-webhook-quo"
  status = 200
  force = true

# SalesAsk recording webhook. SalesAsk POSTs here when a recording's AI
# analysis finishes. SalesAsk offers no payload signing, so the URL registered
# in their Settings > Webhooks carries ?secret=<SALESASK_WEBHOOK_SECRET> and
# the function compares it constant-time.
[[redirects]]
  from = "/api/salesask/webhook"
  to = "/.netlify/functions/pec-webhook-salesask"
  status = 200
  force = true

# Public, token-gated "Let our office know" action from the hosted invoice page
# (customer chose to pay by check / cash / Zelle). Notifies the office by email +
# Slack. Auth is the invoice public_token in the POST body; no secrets exposed.
[[redirects]]
  from = "/api/invoice/intent"
  to = "/.netlify/functions/pec-invoice-intent"
  status = 200
  force = true

# Vendored, version-pinned libraries (e.g. self-hosted supabase-js). The
# filename carries the version, so a new version means a new filename -- cache
# hard. Served as a normal static file (no redirect intercepts /vendor/*).
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The whole app is one big index.html. Always revalidate the HTML entry point so
# a deploy is picked up on the next load instead of serving a stale bundle (the
# recurring "it's not fixed" reports were the browser/CDN holding an old
# index.html). Hashed/versioned assets like /vendor/* stay cached hard above.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The estimator's HTML entry points get the SAME rule (added 2026-08-16 after
# the prompt-94 verification found the dashboard's inline-estimator iframe
# serving a cached /estimator/index.html referencing a bundle two deploys old,
# with no service worker involved -- the identical failure mode the "/" rule
# above exists for). Both real loaders request exactly /estimator/ (the
# dashboard iframe src and the PWA start_url; query strings do not affect
# header matching), so these two paths cover them. Hashed Vite assets under
# /estimator/assets/ cache hard: a new build is a new filename.
[[headers]]
  for = "/estimator/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/estimator/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/estimator/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers (added 2026-07-25, security remediation P1). Applied to every
# path; the cache rules above still apply per-path (Netlify merges header rules).
#
# The clickjacking / sniffing / transport / referrer / feature headers are
# ENFORCED immediately. X-Frame-Options is SAMEORIGIN, not DENY: the app frames
# its own estimator PWA (/estimator/) and its own estimate-preview renderer, and
# embeds a third-party financing widget; DENY blocks even same-origin framing
# and broke the estimator modal (found 2026-07-29). The Content-Security-
# Policy is intentionally REPORT-ONLY for now: index.html is one ~28k-line inline
# <script> plus inline styles, so an enforced policy needs 'unsafe-inline' (and
# Google Maps needs 'unsafe-eval'), which blunts CSP's anti-XSS value. Report-only
# lets us watch DevTools console for violations against the real allow-list below
# for a few days, tighten it, and only then flip to the enforced
# `Content-Security-Policy` key. Origins allowed: self, Supabase (REST/auth/realtime),
# Google Fonts, Google Maps + gstatic tiles, Stripe Checkout (form redirect),
# and https:/data:/blob: images (Supabase Storage photos, CompanyCam, map tiles).
# TODO: before enforcing the CSP, add `frame-src 'self' <Enhancify embed origin>`
# (the financing_embed_url setting) or default-src 'self' will block the
# Enhancify iframe on the estimate/invoice pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "accelerometer=(), gyroscope=(), magnetometer=(), microphone=(), usb=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://maps.googleapis.com https://*.gstatic.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://checkout.stripe.com"
